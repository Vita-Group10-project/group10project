AWSTemplateFormatVersion: "2010-09-09"
Description: Enriched Layer → Glue Crawler + Iceberg + Athena Workgroup


# ==================================================
# PARAMETERS
# ==================================================
Parameters:

  DatabaseName:
    Type: String
    Default: enrich

  EnrichedPath:
    Type: String
    Default: s3://enriched-zone-00/transformed_1/

  IcebergPath:
    Type: String
    Default: s3://enriched-zone-00/iceberg/

  ReportingResultsPath:
    Type: String
    Default: s3://reporting-zone-00/athena-results-main/

  GlueRoleName:
    Type: String
    Default: glue-execution-role


# ==================================================
# RESOURCES
# ==================================================
Resources:

# ==================================================
# Glue Database
# ==================================================
  EnrichDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Enriched analytics layer


# ==================================================
# Glue Crawler (creates parquet table automatically)
# ==================================================
  EnrichCrawler:
    Type: AWS::Glue::Crawler
    Properties:

      Name: enrich-transformed-crawler

      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${GlueRoleName}

      DatabaseName: !Ref DatabaseName

      Targets:
        S3Targets:
          - Path: !Ref EnrichedPath

      TablePrefix: raw_

      # ⭐ REQUIRED FOR AUTO TABLE CREATION + REFRESH
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DELETE_FROM_DATABASE

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING

      Configuration: |
        {
          "Version": 1.0,
          "Grouping": {
            "TableGroupingPolicy": "CombineCompatibleSchemas"
          }
        }


# ==================================================
# Iceberg Table (Athena native analytics table)
# ==================================================
  IcebergTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref DatabaseName
      TableInput:

        Name: enrich_iceberg
        TableType: EXTERNAL_TABLE

        Parameters:
          table_type: ICEBERG

        StorageDescriptor:
          Location: !Ref IcebergPath
          Columns: []

          InputFormat: org.apache.iceberg.mr.hive.HiveIcebergInputFormat
          OutputFormat: org.apache.iceberg.mr.hive.HiveIcebergOutputFormat

          SerdeInfo:
            SerializationLibrary: org.apache.iceberg.mr.hive.HiveIcebergSerDe


# ==================================================
# Athena Workgroup (forces results into reporting bucket)
# ==================================================
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: reporting-workgroup
      State: ENABLED

      WorkGroupConfiguration:

        EnforceWorkGroupConfiguration: true

        ResultConfiguration:
          OutputLocation: !Ref ReportingResultsPath


# ==================================================
# OUTPUTS
# ==================================================
Outputs:

  GlueDatabase:
    Value: !Ref DatabaseName

  CrawlerName:
    Value: enrich-transformed-crawler

  IcebergTable:
    Value: enrich_iceberg

  AthenaWorkgroup:
    Value: reporting-workgroup

  EnrichedPath:
    Value: !Ref EnrichedPath
