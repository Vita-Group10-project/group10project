GlueIngestionJob:
  Type: AWS::Glue::Job
  Properties:

    Name: cms-website-ingestion
    Role: !GetAtt GlueRole.Arn

    Command:
      Name: glueetl          # ⭐ MUST BE glueetl
      ScriptLocation: s3://glue-etl-script-00T/script/glue_ingest.py
      PythonVersion: 3

    GlueVersion: "4.0"

    WorkerType: G.1X
    NumberOfWorkers: 8
    Timeout: 480

    DefaultArguments:
      "--RAW_BUCKET": "raw-zone-00"
      "--PREFIX": "data/"
      "--URL": "https://download.cms.gov/openpayments/PGYR2024_P01232026_01102026/OP_DTL_GNRL_PGYR2024_P01232026_01102026.csv"
      "--job-language": python
