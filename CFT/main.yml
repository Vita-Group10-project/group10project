AWSTemplateFormatVersion: '2010-09-09'
Description: Full CMS Pipeline (Glue → Glue → Crawler → Lambda trigger)

########################################################
# PARAMETERS
########################################################
Parameters:

  ScriptBucket:
    Type: String
    Default: glue-etl-script-00

  RawBucket:
    Type: String
    Default: raw-zone-00

  EnrichedBucket:
    Type: String
    Default: enriched-zone-00

  IngestScript:
    Type: String
    Default: script/data_ingest.py

  TransformScript:
    Type: String
    Default: script/gluejob.py

  LambdaZip:
    Type: String
    Default: athena_trigger.zip

  SourceURL:
    Type: String
    Default: https://download.cms.gov/openpayments/PGYR2024_P01232026_01102026/OP_DTL_GNRL_PGYR2024_P01232026_01102026.csv


########################################################
# RESOURCES
########################################################
Resources:

########################################################
# GLUE ROLE
########################################################
  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# LAMBDA ROLE (separate!)
########################################################
  AthenaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonAthenaFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# GLUE DATABASE
########################################################
  EnrichedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cms_enriched_db


########################################################
# CRAWLER ROLE
########################################################
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# CRAWLER
########################################################
  EnrichedCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: enriched-crawler
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref EnrichedDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${EnrichedBucket}/


########################################################
# GLUE JOB 1 – INGESTION
########################################################
  GlueIngestionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ingestion-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${IngestScript}
        PythonVersion: 3
      DefaultArguments:
        "--RAW_BUCKET": !Ref RawBucket
        "--URL": !Ref SourceURL


########################################################
# GLUE JOB 2 – TRANSFORM
########################################################
  GlueTransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: transform-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${TransformScript}
        PythonVersion: 3


########################################################
# LAMBDA FUNCTION
########################################################
  AthenaTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: athena_trigger.lambda_handler
      Timeout: 900
      Role: !GetAtt AthenaLambdaRole.Arn
      Code:
        S3Bucket: !Ref ScriptBucket
        S3Key: !Ref LambdaZip


########################################################
# EVENTBRIDGE → LAMBDA (auto trigger on enriched bucket)
########################################################
  S3EventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref EnrichedBucket
      Targets:
        - Arn: !GetAtt AthenaTriggerLambda.Arn
          Id: LambdaTarget


  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AthenaTriggerLambda
      Principal: events.amazonaws.com


########################################################
# STEP FUNCTION ROLE
########################################################
  StepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - glue:*
                Resource: "*"


########################################################
# STEP FUNCTION (STRICT SEQUENTIAL)
########################################################
  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "Ingestion",
          "States": {
            "Ingestion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueIngestionJob}"},
              "Next": "Transform"
            },
            "Transform": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueTransformJob}"},
              "Next": "Crawler"
            },
            "Crawler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": {"Name": "enriched-crawler"},
              "End": true
            }
          }
        }


########################################################
# OUTPUTS
########################################################
Outputs:
  StateMachine:
    Value: !Ref PipelineStateMachine
