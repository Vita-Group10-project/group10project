AWSTemplateFormatVersion: '2010-09-09'
Description: Full CMS Pipeline (Glue → Glue → Crawler → Lambda trigger)

########################################################
# PARAMETERS
########################################################
Parameters:

  ScriptBucket:
    Type: String
    Default: glue-etl-script-0

  RawBucket:
    Type: String
    Default: raw-zone-0

  EnrichedBucket:
    Type: String
    Default: enriched-zone-0

  IngestScript:
    Type: String
    Default: script/data_ingest.py

  TransformScript:
    Type: String
    Default: script/gluejob.py

  LambdaZip:
    Type: String
    Default: athena_trigger.zip

  SourceURL:
    Type: String
    Default: https://download.cms.gov/openpayments/PGYR2024_P01232026_01102026/OP_DTL_GNRL_PGYR2024_P01232026_01102026.csv

  TransformInputPath:
    Type: String
    Default: s3://raw-zone-00/direct/2026/02/06/data.csv

  TransformOutputPath:
    Type: String
    Default: s3://enriched-zone-00/transformed_1/


########################################################
# RESOURCES
########################################################
Resources:
########################################################
# GLUE ROLE
########################################################
  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# LAMBDA ROLE
########################################################
  AthenaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonAthenaFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# GLUE DATABASE (metadata only)
########################################################
  EnrichedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cms_enriched_db


########################################################
# CRAWLER ROLE
########################################################
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


########################################################
# 🔥 IMPROVED PRODUCTION CRAWLER
########################################################
  EnrichedCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: cms-enriched-crawler
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref EnrichedDatabase

      TablePrefix: cms_

      Targets:
        S3Targets:
          - Path: !Sub s3://${EnrichedBucket}/transformed_1/

      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

      Configuration: >
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" }
          }
        }


########################################################
# GLUE INGESTION JOB
########################################################
  GlueIngestionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ingestion-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${IngestScript}
        PythonVersion: 3
      DefaultArguments:
        "--RAW_BUCKET": !Ref RawBucket
        "--URL": !Ref SourceURL
        "--job-language": "python"


########################################################
# GLUE TRANSFORM JOB (WITH PARAMETERS)
########################################################
  GlueTransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: transform-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${TransformScript}
        PythonVersion: 3
      DefaultArguments:
        "--INPUT_PATH": !Ref TransformInputPath
        "--OUTPUT_PATH": !Ref TransformOutputPath
        "--job-language": "python"


########################################################
# STEP FUNCTION (STRICT SEQUENTIAL)
########################################################
  StepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GlueAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - glue:*
                Resource: "*"


  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "Ingestion",
          "States": {
            "Ingestion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueIngestionJob}"},
              "Next": "Transform"
            },
            "Transform": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueTransformJob}"},
              "Next": "Crawler"
            },
            "Crawler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": {"Name": "cms-enriched-crawler"},
              "End": true
            }
          }
        }


########################################################
# OUTPUTS
########################################################
Outputs:
  GlueDatabase:
    Value: cms_enriched_db

  StateMachine:
    Value: !Ref PipelineStateMachine
