AWSTemplateFormatVersion: '2010-09-09'
Description: Full CMS Pipeline (Glue → Glue → Crawler → Lambda → Athena)

########################################################
# PARAMETERS
########################################################
Parameters:

  ScriptBucket:
    Type: String
    Default: glue-etl-script-00

  IngestScript:
    Type: String
    Default: script/data_ingest.py

  TransformScript:
    Type: String
    Default: script/gluejob.py

  LambdaZip:
    Type: String
    Default: athena_trigger.zip

  RawBucket:
    Type: String
    Default: raw-zone-00

  EnrichedBucket:
    Type: String
    Default: enriched-zone-00

  SourceURL:
    Type: String
    Default: https://download.cms.gov/openpayments/PGYR2024_P01232026_01102026/OP_DTL_GNRL_PGYR2024_P01232026_01102026.csv


########################################################
# RESOURCES
########################################################
Resources:

######################################################
# IAM ROLES
######################################################

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


  ######################################################
  # GLUE DATABASE (NEW)
  ######################################################
  EnrichedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cms_enriched_db


  ######################################################
  # GLUE CRAWLER ROLE (NEW)
  ######################################################
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


  ######################################################
  # GLUE CRAWLER (NEW)
  ######################################################
  EnrichedCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: enriched-crawler
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref EnrichedDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${EnrichedBucket}/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG


######################################################
# GLUE INGESTION JOB
######################################################
  GlueIngestionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ingestion-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${IngestScript}
        PythonVersion: 3
      DefaultArguments:
        "--RAW_BUCKET": !Ref RawBucket
        "--URL": !Ref SourceURL


######################################################
# GLUE TRANSFORM JOB
######################################################
  GlueTransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: transform-job
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 5
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${ScriptBucket}/${TransformScript}
        PythonVersion: 3


######################################################
# LAMBDA
######################################################
  AthenaTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: athena_trigger.lambda_handler
      Timeout: 900
      Role: !GetAtt GlueExecutionRole.Arn
      Code:
        S3Bucket: !Ref ScriptBucket
        S3Key: !Ref LambdaZip


######################################################
# STEP FUNCTION (UPDATED WITH CRAWLER)
######################################################
  StepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FullAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - glue:*
                  - lambda:InvokeFunction
                Resource: "*"


  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "Ingestion",
          "States": {

            "Ingestion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueIngestionJob}"},
              "Next": "Transform"
            },

            "Transform": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {"JobName": "${GlueTransformJob}"},
              "Next": "StartCrawler"
            },

            "StartCrawler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": {"Name": "enriched-crawler"},
              "Next": "WaitCrawler"
            },

            "WaitCrawler": {
              "Type": "Wait",
              "Seconds": 90,
              "Next": "LambdaTrigger"
            },

            "LambdaTrigger": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {"FunctionName": "${AthenaTriggerLambda}"},
              "End": true
            }
          }
        }


########################################################
# OUTPUTS
########################################################
Outputs:
  Database:
    Value: cms_enriched_db

  Crawler:
    Value: enriched-crawler

  StateMachine:
    Value: !Ref PipelineStateMachine
