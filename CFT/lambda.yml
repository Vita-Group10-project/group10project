AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda trigger on enrich bucket → run Athena queries


# ==================================================
# PARAMETERS
# ==================================================
Parameters:

  EnrichBucket:
    Type: String
    Default: enriched-zone-00

  ReportingBucket:
    Type: String
    Default: reporting-zone-00

  AthenaDatabase:
    Type: String
    Default: enrich

  WorkgroupName:
    Type: String
    Default: reporting-workgroup


# ==================================================
# RESOURCES
# ==================================================
Resources:


# ==================================================
# IAM ROLE FOR LAMBDA
# ==================================================
  AthenaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: athena-trigger-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: AthenaLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # Athena permissions
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: "*"

              # S3 permissions
              - Effect: Allow
                Action:
                  - s3:*
                Resource: "*"

              # Logs
              - Effect: Allow
                Action:
                  - logs:*
                Resource: "*"


# ==================================================
# LAMBDA FUNCTION
# ==================================================
  AthenaTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: enrich-athena-trigger
      Runtime: python3.11
      Handler: index.lambda_handler
      Timeout: 900
      Role: !GetAtt AthenaLambdaRole.Arn

      Environment:
        Variables:
          DATABASE: !Ref AthenaDatabase
          OUTPUT: !Sub s3://${ReportingBucket}/athena-results/
          WORKGROUP: !Ref WorkgroupName

      Code:
        ZipFile: |
          import boto3
          import os

          athena = boto3.client("athena")

          DATABASE = os.environ["DATABASE"]
          OUTPUT = os.environ["OUTPUT"]
          WORKGROUP = os.environ["WORKGROUP"]

          def lambda_handler(event, context):

              print("Triggered by new S3 file")

              query = """
              CREATE OR REPLACE VIEW latest_data AS
              SELECT * FROM enrich_iceberg;
              """

              athena.start_query_execution(
                  QueryString=query,
                  QueryExecutionContext={"Database": DATABASE},
                  ResultConfiguration={"OutputLocation": OUTPUT},
                  WorkGroup=WORKGROUP
              )

              return {"status": "Query started"}


# ==================================================
# ALLOW S3 TO INVOKE LAMBDA
# ==================================================
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AthenaTriggerLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${EnrichBucket}


# ==================================================
# OUTPUTS
# ==================================================
Outputs:

  LambdaName:
    Value: !Ref AthenaTriggerLambda

  TriggerBucket:
    Value: !Ref EnrichBucket

  ReportingLocation:
    Value: !Sub s3://${ReportingBucket}/athena-results/
