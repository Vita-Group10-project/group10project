AWSTemplateFormatVersion: "2010-09-09"
Description: Glue Database + Crawler + Athena Workgroup for Enriched Layer


# ==================================================
# PARAMETERS
# ==================================================
Parameters:

  DatabaseName:
    Type: String
    Default: enrich
    Description: Athena/Glue database name

  TargetPath:
    Type: String
    Default: s3://enriched-zone-00/transformed_1/
    Description: S3 path to enriched transformed data

  TablePrefix:
    Type: String
    Default: enrich_
    Description: Prefix for generated Glue tables

  CrawlerName:
    Type: String
    Default: enrich-transformed-crawler
    Description: Name of Glue crawler

  GlueRoleName:
    Type: String
    Default: glue-execution-role
    Description: Existing Glue IAM Role name (NOT ARN)


# ==================================================
# RESOURCES
# ==================================================
Resources:


  # ==================================================
  # GLUE DATABASE
  # ==================================================
  EnrichDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Enriched/Silver analytics layer tables


  # ==================================================
  # GLUE CRAWLER
  # ==================================================
  EnrichCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Ref CrawlerName

      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${GlueRoleName}

      DatabaseName: !Ref DatabaseName

      Targets:
        S3Targets:
          - Path: !Ref TargetPath

      TablePrefix: !Ref TablePrefix

      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

      Configuration: |
        {
          "Version": 1.0,
          "Grouping": {
            "TableGroupingPolicy": "CombineCompatibleSchemas"
          }
        }


  # ==================================================
  # ATHENA WORKGROUP (NEW)
  # ==================================================
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: reporting-workgroup
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: s3://reporting-zone-00/athena-results/


# ==================================================
# OUTPUTS
# ==================================================
Outputs:

  DatabaseName:
    Value: !Ref DatabaseName

  CrawlerName:
    Value: !Ref CrawlerName

  AthenaWorkgroup:
    Value: reporting-workgroup

  CrawlPath:
    Value: !Ref TargetPath
