AWSTemplateFormatVersion: "2010-09-09"
Description: Crawler for Enriched Zone

Parameters:

  DatabaseName:
    Type: String
    Default: enrich-database

  TargetPath:
    Type: String
    Default: s3://enriched-zone-00/transformed/data/


Resources:

  EnrichDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName


  EnrichCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: enrich-transformed-crawler

      # 🔥 no parameter required
      Role: !Sub arn:aws:iam::${AWS::497330444536}:role/glue-execution-role

      DatabaseName: !Ref DatabaseName

      Targets:
        S3Targets:
          - Path: !Ref TargetPath

      TablePrefix: enrich_

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG


Outputs:
  CrawlerName:
    Value: enrich-transformed-crawler
