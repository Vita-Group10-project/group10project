AWSTemplateFormatVersion: "2010-09-09"
Description: Crawler for Enriched Layer


# ==================================================
# PARAMETERS
# ==================================================
Parameters:

  DatabaseName:
    Type: String
    Default: enrich
    Description: Athena/Glue database name

  TargetPath:
    Type: String
    Default: s3://enriched-zone-00/transformed/data/
    Description: S3 path to enriched transformed data

  TablePrefix:
    Type: String
    Default: enrich_
    Description: Prefix for generated Glue tables

  CrawlerName:
    Type: String
    Default: enrich-transformed-crawler
    Description: Name of Glue crawler

  GlueRoleName:
    Type: String
    Default: glue-execution-role
    Description: Existing Glue IAM Role name (NOT ARN)


# ==================================================
# RESOURCES
# ==================================================
Resources:


  # ==================================================
  # GLUE DATABASE (Athena Catalog DB)
  # ==================================================
  EnrichDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Enriched/Silver analytics layer tables


  # ==================================================
  # GLUE CRAWLER
  # ==================================================
  EnrichCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Ref CrawlerName

      # Build ARN automatically using account id
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${GlueRoleName}

      DatabaseName: !Ref DatabaseName

      Targets:
        S3Targets:
          - Path: !Ref TargetPath

      TablePrefix: !Ref TablePrefix


      # ===== Best Practice Settings =====
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

      Configuration: |
        {
          "Version": 1.0,
          "Grouping": {
            "TableGroupingPolicy": "CombineCompatibleSchemas"
          }
        }


# ==================================================
# OUTPUTS
# ==================================================
Outputs:

  DatabaseName:
    Description: Created Glue database
    Value: !Ref DatabaseName

  CrawlerName:
    Description: Created crawler
    Value: !Ref CrawlerName

  CrawlPath:
    Description: S3 path being crawled
    Value: !Ref TargetPath
