name: Glue-ETL-Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - script/**
      - Lambda-iceberg-table/**
      - CFT/main.yml

env:
  AWS_REGION: us-east-1
  STACK_NAME: main-stack
  SCRIPT_BUCKET: glue-etl-script-00

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # Checkout
    # ==========================================
    - uses: actions/checkout@v4


    # ==========================================
    # AWS Login
    # ==========================================
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}


    # ==========================================
    # Package Lambda
    # ==========================================
    - name: Package Lambda
      run: |
        cd Lambda-iceberg-table
        zip -j athena_trigger.zip athena_trigger.py
        mv athena_trigger.zip ../


    # ==========================================
    # Upload scripts to S3
    # ==========================================
    - name: Upload scripts
      run: |
        aws s3 cp script/ s3://${SCRIPT_BUCKET}/script/ --recursive
        aws s3 cp athena_trigger.zip s3://${SCRIPT_BUCKET}/


    # ==========================================
    # Deploy CloudFormation
    # ==========================================
    - name: Deploy stack
      run: |
        aws cloudformation deploy \
          --template-file CFT/main.yml \
          --stack-name ${STACK_NAME} \
          --capabilities CAPABILITY_NAMED_IAM


    # ==========================================
    # Start Step Function
    # ==========================================
    - name: Start pipeline
      id: start
      run: |
        ARN=$(aws cloudformation describe-stacks \
          --stack-name ${STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='StateMachine'].OutputValue" \
          --output text)

        EXEC_ARN=$(aws stepfunctions start-execution \
          --state-machine-arn $ARN \
          --query executionArn \
          --output text)

        echo "EXEC_ARN=$EXEC_ARN" >> $GITHUB_ENV
        echo "Started execution: $EXEC_ARN"


    # ==========================================
    # WAIT for completion (sequential handled by Step Functions)
    # ==========================================
    - name: Wait for pipeline completion
      run: |
        while true; do
          STATUS=$(aws stepfunctions describe-execution \
            --execution-arn $EXEC_ARN \
            --query status \
            --output text)

          echo "Pipeline status: $STATUS"

          if [ "$STATUS" = "SUCCEEDED" ]; then
            echo "Pipeline completed successfully"
            exit 0
          fi

          if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED_OUT" ] || [ "$STATUS" = "ABORTED" ]; then
            echo "Pipeline failed"
            exit 1
          fi

          sleep 30
        done
