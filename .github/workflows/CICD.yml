name: Glue-ETL-Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - script/**
      - Lambda-iceberg-table/**
      - CFT/main.yml


env:
  AWS_REGION: us-east-1
  STACK_NAME: main-stack
  SCRIPT_BUCKET: glue-etl-script-00


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # Checkout repo
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4


    # ==========================================
    # AWS Login
    # ==========================================
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}


    # ==========================================
    # Package Lambda (python must be root)
    # ==========================================
    - name: Package Lambda
      run: |
        cd Lambda-iceberg-table
        zip -j athena_trigger.zip athena_trigger.py
        mv athena_trigger.zip ../


    # ==========================================
    # Upload Glue scripts to S3
    # ==========================================
    - name: Upload Glue scripts
      run: |
        aws s3 cp script/ s3://${SCRIPT_BUCKET}/script/ --recursive


    # ==========================================
    # Upload Lambda zip to S3
    # ==========================================
    - name: Upload Lambda package
      run: |
        aws s3 cp athena_trigger.zip s3://${SCRIPT_BUCKET}/athena_trigger.zip


    # ==========================================
    # Deploy SINGLE CloudFormation stack
    # ==========================================
    - name: Deploy CloudFormation stack
      run: |
        aws cloudformation deploy \
          --template-file CFT/main.yml \
          --stack-name ${STACK_NAME} \
          --capabilities CAPABILITY_NAMED_IAM \
          --region ${AWS_REGION} \
          --parameter-overrides \
            ScriptBucket=${SCRIPT_BUCKET}


    # ==========================================
    # Start Step Function (runs Glue → Glue → Lambda)
    # ==========================================
    - name: Start Pipeline Execution
      run: |
        ARN=$(aws cloudformation describe-stacks \
          --stack-name ${STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='StateMachine'].OutputValue" \
          --output text)

        echo "Starting Step Function execution..."

        aws stepfunctions start-execution \
          --state-machine-arn $ARN
