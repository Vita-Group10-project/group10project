name: Run Enrich Data Crawler

on:
  workflow_dispatch:

jobs:
  crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start Crawler for Enriched Zone
        run: |
          echo "Starting crawler for enriched data path: s3://enriched-zone-00/transformed/data/"
          aws glue start-crawler --name enrich-transformed-crawler
