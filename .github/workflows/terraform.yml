name: CMS-Full-Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:

# =========================================================
# JOB 1 — INGEST DATA FIRST (MANDATORY)
# =========================================================
  ingestion:
    name: Ingest CMS Data
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "data ingestion"

    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    # ---------------------------------
    # Launch EC2 ingestion
    # ---------------------------------
    - name: Terraform Apply (Ingestion)
      run: |
        terraform init
        terraform apply -auto-approve


    # ---------------------------------
    # WAIT until S3 file exists
    # CRITICAL STEP
    # ---------------------------------
    - name: Wait for CMS file in S3
      run: |
        echo "Waiting for ingestion file..."
        for i in {1..60}; do
          aws s3 ls s3://ter-dump-sahil/cms/raw/ && break
          echo "Not ready yet... retrying"
          sleep 30
        done


# =========================================================
# JOB 2 — DEPLOY GLUE AFTER DATA EXISTS
# =========================================================
  infra:
    name: Deploy Glue/Athena Infra
    needs: ingestion
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infra1

    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Apply (Infra)
      run: |
        terraform init
        terraform apply -auto-approve
