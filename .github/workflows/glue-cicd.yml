name: Glue-ETL-Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - script/gluejob.py

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload ETL script to S3
        run: |
          aws s3 cp script/gluejob.py s3://glue-etl-script-00/script/gluejob.py

      - name: Deploy Glue Job via CloudFormation
        run: |
          aws cloudformation deploy \
            --template-file CFT/glue_job.yml \
            --stack-name glue-creation \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              GlueJobName=glueETL \
              ScriptS3Path=s3://glue-etl-script-00/script/gluejob.py \
              WorkerType=G.1X \
              NumberOfWorkers=5 \
              InputPath=s3://raw-zone-00/data/ \
              OutputPath=s3://enriched-zone-00/transformed/data/ \
            --region us-east-1

      - name: Start AWS Glue Job
        run: |
          set -x
          aws glue start-job-run \
            --job-name glueETL \
            --region us-east-1 \
            --arguments "{
              \"--INPUT_PATH\":\"s3://raw-zone-00/data/\",
              \"--OUTPUT_PATH\":\"s3://enriched-zone-00/transformed/data/\"
          }"

